<!-- REPRODUCTOR FLOTANTE TIPO VINILO -->
<div class="fixed top-4 right-4 z-50">
  <div class="player-card backdrop-blur-md bg-white/20 border border-white/30 rounded-3xl p-4 shadow-2xl flex flex-col items-center w-48 sm:w-56 text-slate-800">
    
    <!-- Tocadiscos / Vinilo giratorio -->
    <div class="relative w-28 h-28 flex items-center justify-center mb-3">
      <!-- Brazo de la aguja -->
      <div id="turntableArm" class="tonearm"></div>
      
      <!-- Disco de vinilo -->
      <div id="vinylDisk" class="vinyl w-24 h-24 rounded-full shadow-xl flex items-center justify-center">
        <!-- Carátula central del vinilo -->
        <div id="trackCover" class="w-10 h-10 rounded-full bg-cover bg-center border-2 border-slate-900 shadow-inner" style="background-image: url('https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=150');"></div>
      </div>
    </div>

    <!-- Info de la Canción -->
    <div class="text-center w-full px-2 mb-2">
      <h4 id="trackTitle" class="text-xs font-bold text-slate-800 truncate">Nuestra Canción</h4>
      <p id="trackArtist" class="text-[10px] text-slate-600 truncate">Karol G / Rels B</p>
    </div>

    <!-- Barra de progreso y tiempos -->
    <div class="w-full px-1 space-y-1">
      <div class="w-full bg-white/40 h-1 rounded-full overflow-hidden cursor-pointer" onclick="seekAudio(event)">
        <div id="audioProgress" class="bg-rose-500 h-full w-0 transition-all duration-200"></div>
      </div>
      <div class="flex justify-between text-[9px] text-slate-500 font-medium">
        <span id="currentTime">0:00</span>
        <span id="totalDuration">0:00</span>
      </div>
    </div>

    <!-- Controles Multimedia -->
    <div class="flex items-center justify-center gap-4 mt-2 text-slate-700">
      <button onclick="prevTrack()" class="hover:text-rose-600 transition text-xs">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button onclick="togglePlay()" id="playBtn" class="w-8 h-8 rounded-full bg-white/70 hover:bg-white text-rose-500 shadow-sm flex items-center justify-center transition transform active:scale-95 text-xs">
        <i class="fa-solid fa-play ml-0.5"></i>
      </button>
      <button onclick="nextTrack()" class="hover:text-rose-600 transition text-xs">
        <i class="fa-solid fa-forward-step"></i>
      </button>
    </div>
  </div>
</div>

<!-- Elemento de Audio Oculto -->
<audio id="bgAudio" preload="metadata"></audio>
